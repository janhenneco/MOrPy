[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-runner"
version = "0.1.0"
description = "Python package to run MESA models in parallel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0"]

[project.optional-dependencies]
preview = ["pandas>=2.0"]
mpi = ["mpi4py>=4.0"]
docs = [
  "sphinx>=7.0",
  "furo>=2024.0.0",
  "myst-parser>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/manual_tests"]