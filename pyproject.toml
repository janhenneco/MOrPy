[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morpy"
authors = [{ name = "Jan Henneco", email = "jan.henneco@gmail.com" }]
version = "0.2.1"
description = "Python interface the Modules for Experiments in Stellar Astrophysics code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "numpy>=1.23.5"]
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
preview = ["pandas>=2.0"]
mpi = ["mpi4py>=4.0"]
ipykernel = ["ipykernel"]
jupyter = ["jupyter"]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/janhenneco/MOrPy"
Repository = "https://github.com/janhenneco/MOrPy"
Issues = "https://github.com/janhenneco/MOrPy/issues"

[project.scripts]
morpy_status = "morpy.cli:main_status"
morpy_stop = "morpy.cli:main_stop"
morpy_cancel_model = "morpy.cli:main_cancel_model"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/manual_tests"]
