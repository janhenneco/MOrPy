[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-runner"
authors = [{ name = "Jan Henneco", email = "jan.henneco@gmail.com" }]
version = "0.1.0"
description = "Python interface the Modules for Experiments in Stellar Astrophysics code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0"]
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
preview = ["pandas>=2.0"]
mpi = ["mpi4py>=4.0"]
docs = [
  "sphinx>=7.0",
  "furo>=2024.0.0",
  "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/janhenneco/mesa-runner"
Repository = "https://github.com/janhenneco/mesa-runner"
Issues = "https://github.com/janhenneco/mesa-runner/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/manual_tests"]